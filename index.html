<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeAlpha Music Player - Interactive Web-Based Audio Player built with HTML5, CSS3, and JavaScript by Muhammad Saim Ahmad">
  <title>CodeAlpha Music Player | Responsive Audio Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="player-wrapper">
    <!-- Header / Branding -->
    <header class="player-header">
      <h1 class="player-main-title">Modern Music Player</h1>
    </header>

    <!-- Main Music Player Card -->
    <main class="music-card" id="musicCard" role="region" aria-label="Music Player">
      
      <!-- Hidden Audio Element -->
      <audio id="audioSource" preload="metadata"></audio>

      <!-- Album Artwork Section -->
      <section class="album-section">
        <div class="disc-wrapper" id="discWrapper">
          <div class="vinyl-grooves"></div>
          <img src="images/cover1.jpg" alt="Album Cover" class="cover-art" id="coverArt">
          <div class="center-label"></div>
        </div>
      </section>

      <!-- Song Meta Info -->
      <section class="meta-section">
        <h2 class="song-title" id="songTitle">Famous</h2>
        <p class="song-artist" id="songArtist">Sidhu Moose Wala</p>
      </section>

      <!-- Progress Tracking Bar -->
      <section class="progress-section" aria-label="Audio progress slider">
        <div class="time-display">
          <span class="current-time" id="currentTime">0:00</span>
          <span class="total-duration" id="totalDuration">0:00</span>
        </div>
        
        <div class="progress-track-wrapper" id="progressTrackWrapper">
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
        </div>
      </section>

      <!-- Primary Control Buttons -->
      <section class="controls-section" role="group" aria-label="Player playback controls">
        <!-- Shuffle Toggle -->
        <button type="button" class="btn-ctrl btn-sub" id="shuffleBtn" aria-label="Toggle Shuffle" title="Shuffle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <!-- Previous Button -->
        <button type="button" class="btn-ctrl btn-nav" id="prevBtn" aria-label="Previous Track" title="Previous Song">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>

        <!-- Play / Pause Master Button -->
        <button type="button" class="btn-ctrl btn-play" id="playPauseBtn" aria-label="Play song" title="Play / Pause">
          <!-- Play Icon -->
          <svg class="icon-play" id="iconPlay" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <!-- Pause Icon -->
          <svg class="icon-pause" id="iconPause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>

        <!-- Next Button -->
        <button type="button" class="btn-ctrl btn-nav" id="nextBtn" aria-label="Next Track" title="Next Song">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>

        <!-- Repeat Toggle -->
        <button type="button" class="btn-ctrl btn-sub" id="repeatBtn" aria-label="Toggle Repeat" title="Repeat Track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
      </section>

      <!-- Volume Section -->
      <section class="volume-section" aria-label="Audio volume control">
        <button type="button" class="btn-volume" id="volumeBtn" aria-label="Mute or Unmute" title="Mute/Unmute">
          <!-- Unmuted Icon -->
          <svg id="iconVolumeHigh" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <!-- Muted Icon -->
          <svg id="iconVolumeMuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <div class="volume-slider-track" id="volumeSliderTrack">
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume level">
        </div>
        <span class="volume-value" id="volumeValue">80%</span>
      </section>

      <!-- Interactive Playlist Section (Bonus Feature) -->
      <section class="playlist-section" aria-label="Track playlist">
        <div class="playlist-header">
          <div class="playlist-header-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <h3 class="playlist-title">Playlist Collection</h3>
          </div>
          <span class="playlist-badge" id="playlistBadge">3 Tracks</span>
        </div>

        <ul class="playlist-list" id="playlistList" role="list">
          <!-- Dynamically injected via JavaScript -->
        </ul>
      </section>

    </main>


  </div>

  <script src="script.js"></script>
</body>
</html>
